name: Desktop ISO
on: workflow_dispatch

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: cachyos/cachyos-v4:latest
      options: --privileged
    name: Build
    outputs:
      builddate: ${{ steps.date.outputs.builddate }}
    steps:
      - name: Install dependencies
        id: dependencies
        run: |
          pacman -Syu --noconfirm archiso mkinitcpio-archiso squashfs-tools grub sudo git

      - name: Get build date
        id: date
        run: |
          echo "builddate=$(date +'%y%m%d')" >> $GITHUB_OUTPUT

      - name: Clone CachyOS-Live-ISO
        id: clone
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Create build user
        id: user-archiso
        run: |
          useradd builder -m
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chmod -R a+rw .

      - name: Build ISO (${{ steps.date.outputs.builddate }})
        id: build
        run: |
          sudo -H -E -u builder ./buildiso.sh -p desktop

      - name: Check Calamares libraries
        id: check
        run: |
          root=$(find work -type d -path '*/airootfs' | head -1)
          if [ -z "$root" ]; then
            echo "airootfs not found, skipping check"; exit 0
          fi
          if chroot "$root" ldd /usr/bin/calamares | grep 'not found'; then
            echo "Calamares is linked against missing libraries"; exit 1
          fi

      - name: Upload ISO to artifacts
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: cachyos-desktop-linux-${{ steps.date.outputs.builddate }}
          path: out/desktop/*
          compression-level: 0
          retention-days: 1
